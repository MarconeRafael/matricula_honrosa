<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Coordenação - Cadastro de Turmas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  <h1>Coordenação - Cadastro de Turmas</h1>
  <p>Associe professores aptos e salas disponíveis às turmas do próximo semestre.</p>

  <table class="table table-bordered table-hover">
    <thead>
      <tr>
        <th>Código</th>
        <th>Carga Horária</th>
        <th>Precisa Computador</th>
        <th>Sala</th>
        <th>Professores Aptos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="turmas-table">
      <!-- Exemplo -->
      <tr>
        <td>MAT101</td>
        <td>60h</td>
        <td>Sim</td>
        <td>
          <select class="form-select">
            <option>Sala 101 (30 alunos, com PC)</option>
            <option>Sala 102 (40 alunos, sem PC)</option>
          </select>
        </td>
        <td>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="prof1">
            <label class="form-check-label">Prof. João (Matemática)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="prof2">
            <label class="form-check-label">Prof. Maria (Matemática/Física)</label>
          </div>
        </td>
        <td><button class="btn btn-primary btn-sm">Salvar</button></td>
      </tr>
    </tbody>
  </table>

  <button class="btn btn-success">Adicionar Nova Turma</button>
</div>
</body>
</html>
