<!DOCTYPE html>
<html lang="pt-br">
<head>

<title>Professor - Solicitação de Turmas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  <h1>Solicitação de Turmas</h1>

  <table class="table table-bordered table-hover">

      <tr>
        <th>Código da Turma</th>
        <th>Disciplina</th>
        <th>Solicitar</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>MAT101</td>
        <td>Matemática</td>
        <td><button class="btn btn-primary btn-sm">Solicitar</button></td>
        <td>Pendente</td>
      </tr>
      <tr>
        <td>FIS201</td>
        <td>Física</td>
        <td><button class="btn btn-primary btn-sm">Solicitar</button></td>
        <td>Aprovado</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
